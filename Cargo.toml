[workspace]
members = ["crates/xxgate-core", "crates/xxgate-codex", "crates/xxgate-transport", "crates/xxgate-postgres", "crates/xxgate-server"]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT"
rust-version = "1.96"

[workspace.dependencies]
xxgate-core = { path = "crates/xxgate-core" }
xxgate-codex = { path = "crates/xxgate-codex" }
xxgate-transport = { path = "crates/xxgate-transport" }
xxgate-postgres = { path = "crates/xxgate-postgres" }
anyhow = "1"
async-trait = "0.1"
argon2 = "0.5"
axum = { version = "0.8", features = ["macros"] }
base64 = "0.22"
bytes = "1"
chacha20poly1305 = "0.10"
chrono = { version = "0.4", features = ["serde"] }
futures = "0.3"
eventsource-stream = "=0.2.3"
http = "1"
hmac = "0.12"
http-body-util = "0.1"
rand = "0.8"
reqwest = { version = "=0.12.28", features = ["cookies", "json", "stream", "rustls-tls-native-roots"] }
native-tls = "=0.2.14"
os_info = "=3.14.0"
hyper = "=1.8.1"
hyper-util = "=0.1.20"
rustls = { version = "=0.23.36", default-features = false, features = ["aws_lc_rs", "std"] }
rust_decimal = { version = "1", features = ["serde-with-str"] }
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["raw_value"] }
sha2 = "0.10"
sqlx = { version = "0.8", default-features = false, features = ["runtime-tokio-rustls", "postgres", "uuid", "chrono", "json", "rust_decimal", "migrate", "macros"] }
thiserror = "2"
tokio = { version = "1", features = ["full", "test-util"] }
tokio-stream = { version = "0.1", features = ["sync"] }
tokio-util = { version = "0.7", features = ["rt"] }
tower = { version = "0.5", features = ["util"] }
tower-http = { version = "0.6", features = ["fs", "trace", "set-header", "compression-br", "compression-gzip"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }
url = "2"
uuid = { version = "1", features = ["v4", "v5", "serde"] }

[profile.dev]
debug = 1

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
await_holding_lock = "deny"
