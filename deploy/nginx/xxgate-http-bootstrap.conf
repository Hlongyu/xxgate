# Temporary edge site used only to issue the first HTTPS certificate.
server {
    listen 80;
    listen [::]:80;
    server_name xxgate.example.com;
    location ^~ /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }
    location / {
        default_type text/plain;
        return 503 "XXGate deployment is in progress.\n";
    }
}
