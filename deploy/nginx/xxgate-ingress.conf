# Complete config for the optional stable Docker ingress. Host Nginx and Docker
# alias xxgate use this same front door. Only active-upstream.inc is switched.
worker_processes auto;
error_log /dev/stderr warn;
pid /var/run/nginx.pid;
events { worker_connections 4096; }
http {
    access_log off;
    map $http_upgrade $xxgate_connection { default upgrade; '' ''; }
    upstream xxgate_active {
        include /etc/nginx/xxgate/active-upstream.inc;
        keepalive 32;
    }
    server {
        listen 8787;
        server_name _;
        underscores_in_headers on;
        client_max_body_size 256m;
        gzip off;
        location / {
            proxy_pass http://xxgate_active;
            proxy_http_version 1.1;
            proxy_set_header Host $http_host;
            proxy_set_header X-Real-IP $http_x_real_ip;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $xxgate_connection;
            proxy_connect_timeout 10s;
            proxy_read_timeout 3600s;
            proxy_send_timeout 3600s;
            proxy_buffering off;
            proxy_request_buffering off;
            proxy_cache off;
            proxy_next_upstream off;
        }
    }
}
