# Example edge proxy: HTTPS termination and forwarding over a private tunnel.
server {
    listen 80;
    listen [::]:80;
    server_name xxgate.example.com;
    location ^~ /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }
    location / {
        return 301 https://xxgate.example.com$request_uri;
    }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name xxgate.example.com;
    ssl_certificate /etc/letsencrypt/live/xxgate.example.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/xxgate.example.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    # Preserve legacy session_id/thread_id/conversation_id headers.
    underscores_in_headers on;
    client_max_body_size 256m;
    # Compression is negotiated by XXGate (Brotli/gzip), including on loopback.
    gzip off;

    location / {
        proxy_pass http://192.0.2.20:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";
        proxy_connect_timeout 10s;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
        proxy_buffering off;
        proxy_request_buffering off;
        proxy_cache off;
        proxy_next_upstream off;
    }
}
