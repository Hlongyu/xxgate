# Keep this upstream stable across releases. The included file is changed
# atomically by deploy/bluegreen-switch.py and reloaded with nginx -s reload.
# Existing SSE/WebSocket connections finish on their original upstream.
upstream xxgate_active {
    # Keep the include outside conf.d/*.conf so Nginx does not parse the
    # individual `server host:port;` line at the http level as a second file.
    include /etc/nginx/xxgate-active-upstream.inc;
    keepalive 32;
}

# Example origin: traffic from the edge proxy over a private tunnel.
server {
    listen 192.0.2.20:8080;
    server_name xxgate.example.com;
    allow 192.0.2.10;
    deny all;
    # Preserve legacy session_id/thread_id/conversation_id headers.
    underscores_in_headers on;
    client_max_body_size 256m;
    gzip off;

    location / {
        proxy_pass http://xxgate_active;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $http_x_real_ip;
        proxy_set_header X-Forwarded-For $http_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        set $xxgate_connection "";
        if ($http_upgrade != "") { set $xxgate_connection "upgrade"; }
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $xxgate_connection;
        proxy_connect_timeout 10s;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
        proxy_buffering off;
        proxy_request_buffering off;
        proxy_cache off;
        proxy_next_upstream off;
    }
}
