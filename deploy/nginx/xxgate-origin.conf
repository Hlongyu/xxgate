# Example origin: traffic from the edge proxy over a private tunnel.
server {
    listen 192.0.2.20:8080;
    server_name xxgate.example.com;
    allow 192.0.2.10;
    deny all;
    # Preserve legacy session_id/thread_id/conversation_id headers.
    underscores_in_headers on;
    client_max_body_size 256m;
    gzip off;

    location / {
        proxy_pass http://127.0.0.1:8797;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $http_x_real_ip;
        proxy_set_header X-Forwarded-For $http_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header Connection "";
        proxy_connect_timeout 10s;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
        proxy_buffering off;
        proxy_request_buffering off;
        proxy_cache off;
        proxy_next_upstream off;
    }
}
